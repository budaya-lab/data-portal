name: Submit dataset to portal

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Dataset repository name in this GitHub account (ds-*)"
        required: true
        type: string
      commit:
        description: "Full lowercase SHA of the pushed metadata commit"
        required: true
        type: string
      branch:
        description: "Pushed source branch (blank uses the source default branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: catalogue-submission-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  submit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check required credentials
        env:
          DATASET_READ_TOKEN: ${{ secrets.DATASET_READ_TOKEN }}
          CATALOGUE_PR_TOKEN: ${{ secrets.CATALOGUE_PR_TOKEN }}
        run: |
          test -n "$DATASET_READ_TOKEN" || { echo 'Set the DATASET_READ_TOKEN repository secret.'; exit 1; }
          test -n "$CATALOGUE_PR_TOKEN" || { echo 'Set the CATALOGUE_PR_TOKEN repository secret.'; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare single-dataset proposal
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.DATASET_READ_TOKEN }}
          DATASET_ACCOUNT: ${{ github.repository_owner }}
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          SOURCE_BRANCH: ${{ inputs.branch }}
        run: |
          args=("$DATASET_ACCOUNT/$SOURCE_REPOSITORY" --commit "$SOURCE_COMMIT" --apply)
          if test -n "$SOURCE_BRANCH"; then
            args+=(--branch "$SOURCE_BRANCH")
          fi
          pnpm catalogue:submit "${args[@]}"
      - name: Add public-safe review report to run summary
        if: always()
        run: |
          if test -f .tmp/catalogue-submission-report.md; then
            cat .tmp/catalogue-submission-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate proposed catalogue
        run: pnpm validate
      - name: Open or update review PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.CATALOGUE_PR_TOKEN }}
          base: main
          branch: ${{ steps.prepare.outputs.pr_branch }}
          title: "chore(catalogue): submit ${{ inputs.repository }}"
          commit-message: "chore(catalogue): submit dataset metadata"
          body-path: .tmp/catalogue-submission-report.md
          add-paths: |
            datasets.json
            :(glob)public/data/**/*.csv
